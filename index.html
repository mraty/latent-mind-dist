<html lang="en">
<head>

  <title>Latent Mind — Local notes that think with you</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Latent Mind is a local-first writing tool with a small, on-device language model that finds connections in your own notes. Plain Markdown on disk. No cloud. No account. Latest version: 0.2.11." />
  <link rel="canonical" href="https://latentmind.approk.com/" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    body {

    *::-webkit-scrollbar { width: 10px; height: 10px; }
    *::-webkit-scrollbar-thumb { background: rgba(120,120,120,0.25); border-radius: 6px; }
    *::-webkit-scrollbar-track { background: transparent; }
  </style>
